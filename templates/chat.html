<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <div class="avatar-bg">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <div>
                    <h1>Medical Assistant</h1>
                    <span class="status"><span class="dot"></span> Online</span>
                </div>
            </div>
        </header>

        <main class="chat-main" id="chat-box">
            <div class="message bot-message">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="text">Hello! I am your AI Medical Assistant. How can I help you today?</div>
            </div>
        </main>

        <footer class="chat-footer">
            <form id="chat-form" class="input-area">
                <input type="text" id="user-input" name="msg" placeholder="Type your medical query here..." autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </footer>
    </div>

    <script>
        $(document).ready(function() {
            $("#chat-form").on("submit", function(event) {
                event.preventDefault();
                
                const rawText = $("#user-input").val();
                if (!rawText.trim()) return;

                const userHtml = `
                    <div class="message user-message">
                        <div class="text">${rawText}</div>
                    </div>
                `;
                
                $("#user-input").val("");
                $("#chat-box").append(userHtml);
                $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);

                const loadingHtml = `
                    <div class="message bot-message loading" id="loading-indicator">
                        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="text">
                            <span class="dot-bounce"></span>
                            <span class="dot-bounce"></span>
                            <span class="dot-bounce"></span>
                        </div>
                    </div>
                `;
                $("#chat-box").append(loadingHtml);
                $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);

                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get",
                }).done(function(data) {
                    $("#loading-indicator").remove();
                    const botHtml = `
                        <div class="message bot-message">
                            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="text">${data}</div>
                        </div>
                    `;
                    $("#chat-box").append(botHtml);
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                }).fail(function() {
                    $("#loading-indicator").remove();
                    const errorHtml = `
                        <div class="message bot-message error">
                            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="text">Sorry, I encountered an error. Please try again.</div>
                        </div>
                    `;
                    $("#chat-box").append(errorHtml);
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                });
            });
        });
    </script>
</body>
</html>
